{{- if .Values.metrics.enabled }}
{{- $ns := .Values.metrics.namespace -}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: orchard-metrics
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: Service
metadata:
  name: victoriametrics
  namespace: {{ $ns }}
  labels:
    app: victoriametrics
spec:
  type: ClusterIP
  ports:
    - { name: http, port: 8428, targetPort: 8428, protocol: TCP }
  selector:
    app: victoriametrics
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: victoriametrics
  namespace: {{ $ns }}
  labels:
    app: victoriametrics
spec:
  serviceName: victoriametrics
  replicas: 1
  selector:
    matchLabels:
      app: victoriametrics
  template:
    metadata:
      labels:
        app: victoriametrics
    spec:
      securityContext:
        fsGroup: 1000
      {{- include "orchard.priorityClass" $ | nindent 6 }}
      containers:
        - name: victoriametrics
          image: {{ .Values.metrics.victoriametrics.image }}
          args:
            - "-storageDataPath=/data"
            - "-retentionPeriod={{ .Values.metrics.victoriametrics.retention }}"
            - "-httpListenAddr=:8428"
            - "-storage.minFreeDiskSpaceBytes=512MB"
            - "-search.maxConcurrentRequests=16"
            - "-search.maxQueryDuration=30s"
            - "-search.maxSeries=300000"
            - "-search.maxPointsPerTimeseries=30000"
            - "-search.latencyOffset=15s"
            - "-memory.allowedPercent={{ .Values.metrics.victoriametrics.memoryAllowedPercent }}"
            - "-loggerLevel=INFO"
          ports:
            - { name: http, containerPort: 8428 }
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml .Values.metrics.victoriametrics.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with include "orchard.storageClass" (dict "value" .Values.metrics.victoriametrics.storage.storageClass "apiVersion" "apps/v1" "kind" "StatefulSet" "namespace" .Values.metrics.namespace "name" "victoriametrics") }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.metrics.victoriametrics.storage.size }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vmagent
  namespace: {{ $ns }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-vmagent
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/metrics", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-vmagent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-vmagent
subjects:
  - kind: ServiceAccount
    name: vmagent
    namespace: {{ $ns }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: {{ $ns }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-kube-state-metrics
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - pods
      - services
      - resourcequotas
      - replicationcontrollers
      - limitranges
      - persistentvolumeclaims
      - namespaces
      - endpoints
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "daemonsets", "deployments", "replicasets"]
    verbs: ["list", "watch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies", "ingresses"]
    verbs: ["list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: {{ $ns }}
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: {{ $ns }}
  labels:
    app: kube-state-metrics
spec:
  type: ClusterIP
  ports:
    - { name: http-metrics, port: 8080, targetPort: 8080 }
    - { name: telemetry,    port: 8081, targetPort: 8081 }
  selector:
    app: kube-state-metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: {{ $ns }}
  labels:
    app: kube-state-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-state-metrics
  template:
    metadata:
      labels:
        app: kube-state-metrics
    spec:
      serviceAccountName: kube-state-metrics
      {{- include "orchard.priorityClass" $ | nindent 6 }}
      containers:
        - name: kube-state-metrics
          image: {{ .Values.metrics.kubeStateMetrics.image }}
          args:
            - "--port=8080"
            - "--telemetry-port=8081"
            - "--resources=daemonsets,deployments,jobs,pods,replicasets,statefulsets,nodes,namespaces,services,horizontalpodautoscalers,resourcequotas,persistentvolumeclaims,cronjobs,limitranges,replicationcontrollers,storageclasses,endpoints,ingresses,networkpolicies"
          ports:
            - { name: http-metrics, containerPort: 8080 }
            - { name: telemetry,    containerPort: 8081 }
          readinessProbe:
            httpGet: { path: /readyz, port: telemetry }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /livez, port: http-metrics }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml .Values.metrics.kubeStateMetrics.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
---
{{- $nodeExporterAuth := lookup "v1" "Secret" $ns "node-exporter-auth" }}
{{- $nodeExporterPassword := randAlphaNum 40 }}
{{- $nodeExporterWeb := printf "basic_auth_users:\n  vmagent: %s\n" (bcrypt $nodeExporterPassword) }}
{{- if and $nodeExporterAuth $nodeExporterAuth.data (index $nodeExporterAuth.data "password") (index $nodeExporterAuth.data "web.yml") }}
{{- $nodeExporterPassword = index $nodeExporterAuth.data "password" | b64dec }}
{{- $nodeExporterWeb = index $nodeExporterAuth.data "web.yml" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: node-exporter-auth
  namespace: {{ $ns }}
  labels:
    app: node-exporter
type: Opaque
data:
  password: {{ $nodeExporterPassword | b64enc | quote }}
  web.yml: {{ $nodeExporterWeb | b64enc | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: node-exporter
  namespace: {{ $ns }}
  labels:
    app: node-exporter
spec:
  clusterIP: None
  ports:
    - { name: metrics, port: 9100, targetPort: 9100 }
  selector:
    app: node-exporter
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: {{ $ns }}
  labels:
    app: node-exporter
spec:
  selector:
    matchLabels:
      app: node-exporter
  template:
    metadata:
      labels:
        app: node-exporter
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - operator: Exists
      {{- include "orchard.priorityClass" $ | nindent 6 }}
      containers:
        - name: node-exporter
          image: {{ .Values.metrics.nodeExporter.image }}
          args:
            - "--web.listen-address=$(HOST_IP):9100"
            - "--web.config.file=/etc/node-exporter/web.yml"
            - "--path.procfs=/host/proc"
            - "--path.sysfs=/host/sys"
            - "--path.rootfs=/host/root"
            - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|var/lib/(docker|kubelet)/.+)($|/)"
            - "--collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$"
            - "--no-collector.wifi"
            - "--no-collector.hwmon"
          env:
            - name: HOST_IP
              valueFrom:
                fieldRef: { fieldPath: status.hostIP }
          ports:
            - { name: metrics, containerPort: 9100 }
          volumeMounts:
            - { name: proc,   mountPath: /host/proc, readOnly: true }
            - { name: sys,    mountPath: /host/sys,  readOnly: true }
            - { name: rootfs, mountPath: /host/root, readOnly: true, mountPropagation: HostToContainer }
            - { name: auth, mountPath: /etc/node-exporter, readOnly: true }
          resources:
            {{- toYaml .Values.metrics.nodeExporter.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      volumes:
        - { name: proc,   hostPath: { path: /proc } }
        - { name: sys,    hostPath: { path: /sys } }
        - { name: rootfs, hostPath: { path: / } }
        - name: auth
          secret:
            secretName: node-exporter-auth
            defaultMode: 0444
            items:
              - { key: web.yml, path: web.yml }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vmagent-config
  namespace: {{ $ns }}
data:
  scrape.yaml: |
    global:
      scrape_interval: 15s
      scrape_timeout: 10s
      external_labels:
        cluster: {{ .Values.metrics.clusterLabel }}

    scrape_configs:
      - job_name: kubernetes-cadvisor
        scheme: https
        tls_config:
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__address__]
            regex: (.+):(.+)
            target_label: __address__
            replacement: $1:10250
          - target_label: __metrics_path__
            replacement: /metrics/cadvisor
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: 'container_(cpu_usage_seconds_total|cpu_cfs_throttled_periods_total|cpu_cfs_periods_total|memory_working_set_bytes|network_receive_bytes_total|network_transmit_bytes_total|fs_usage_bytes|fs_limit_bytes)'
            action: keep
          - source_labels: [__name__, container]
            regex: 'container_(cpu|memory|fs)_.*;POD'
            action: drop

      - job_name: kubernetes-kubelet
        scrape_interval: 60s
        scheme: https
        tls_config:
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__address__]
            regex: (.+):(.+)
            target_label: __address__
            replacement: $1:10250
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: 'kubelet_(running_pods|running_containers|pod_start_duration_seconds.*|volume_stats_(used|capacity)_bytes)'
            action: keep

      - job_name: kube-state-metrics
        kubernetes_sd_configs:
          - role: endpoints
            namespaces: { names: [{{ $ns }}] }
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            regex: kube-state-metrics;http-metrics
            action: keep
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: 'kube_cronjob_(info|spec_suspend|status_last_schedule_time|status_last_successful_time)|kube_daemonset_status_(current_number_scheduled|desired_number_scheduled|number_available|number_misscheduled|number_ready|number_unavailable|updated_number_scheduled)|kube_deployment_(spec_paused|spec_replicas|spec_strategy_rollingupdate_max_surge|spec_strategy_rollingupdate_max_unavailable|status_condition|status_replicas|status_replicas_available|status_replicas_ready|status_replicas_unavailable|status_replicas_updated)|kube_endpoint_(address|info)|kube_ingress_(path|tls)|kube_job_(complete|failed|info|owner|status_failed|status_succeeded)|kube_limitrange|kube_persistentvolumeclaim_(access_mode|resource_requests_storage_bytes|status_phase)|kube_pod_(container_info|container_resource_limits|container_resource_requests|container_status_ready|container_status_running|container_status_terminated|container_status_terminated_reason|container_status_waiting|created|deletion_timestamp|owner|spec_volumes_persistentvolumeclaims_info|spec_volumes_persistentvolumeclaims_readonly|start_time|status_phase|status_qos_class|status_scheduled|tolerations)|kube_pod_init_container_(info|resource_limits|resource_requests|status_ready|status_restarts_total|status_running|status_waiting)|kube_replicaset_.*|kube_resourcequota|kube_service_spec_type'
            action: drop

      - job_name: node-exporter
        basic_auth:
          username: vmagent
          password_file: /etc/node-exporter-auth/password
        kubernetes_sd_configs:
          - role: endpoints
            namespaces: { names: [{{ $ns }}] }
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            regex: node-exporter;metrics
            action: keep
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
        metric_relabel_configs:
          - source_labels: [__name__, device]
            regex: 'node_network_.*;lxc.*'
            action: drop

      # CloudNativePG instance exporter: the Postgres series behind a database's
      # Observe charts (connections, transactions, cache hits, replication lag,
      # size, deadlocks). Only the series the server queries are kept.
      - job_name: cnpg-instances
        kubernetes_sd_configs: [{ role: pod }]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_cnpg_io_podRole]
            regex: instance
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: metrics
            action: keep
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
            target_label: cluster
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: 'cnpg_(backends_total|pg_replication_lag|pg_database_size_bytes|pg_stat_database_(xact_commit|xact_rollback|blks_hit|blks_read|deadlocks)|collector_pg_wal_archive_status)'
            action: keep

      - job_name: kubernetes-pods
        kubernetes_sd_configs: [{ role: pod }]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            regex: 'true'
            action: keep
          - source_labels: [__meta_kubernetes_namespace]
            regex: {{ join "|" (concat .Values.metrics.ingress.traefik.namespaces .Values.metrics.ingress.haproxy.namespaces) | quote }}
            action: drop
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: '(traefik|haproxy|cnpg|kube|container|kubelet|node|vm|go_gc)_.*'
            action: drop

      # HAProxy ingress controller — per-backend HTTP metrics (request rate,
      # response codes, response time). These replace the retired Cilium/Hubble
      # L7 series the Orchard dashboard used before the HAProxy switchover.
      # Scraped off the controller's built-in Prometheus exporter on the stat
      # port (1024, enabled via controller.prometheus in the haproxy chart).
      # Datadog scrapes the same endpoint independently via its node agent; this
      # is the in-cluster VM copy the dashboard queries (no per-query billing).
      # Keep only the three backend series the dashboard reads to bound the
      # cardinality the per-server/process firehose would otherwise add.
      - job_name: haproxy-ingress
        params:
          scope: [backend]
        kubernetes_sd_configs:
          - role: pod
            namespaces: { names: {{ .Values.metrics.ingress.haproxy.namespaces | toJson }} }
            selectors:
              - role: pod
                label: {{ include "orchard.metricsIngressSelector" .Values.metrics.ingress.haproxy.labels | quote }}
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace]
            regex: {{ join "|" .Values.metrics.ingress.haproxy.namespaces | quote }}
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: {{ .Values.metrics.ingress.haproxy.portName | quote }}
            action: keep
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: 'haproxy_backend_(http_responses_total|response_time_average_seconds|max_response_time_seconds)'
            action: keep

      # Traefik (the k3s default ingress and the chart's gateway class) — per
      # service request counts and latency histograms, from its Prometheus
      # entrypoint (`metrics`, 9100 in the Traefik chart). The server picks
      # whichever controller has series for an app, so both jobs can coexist.
      - job_name: traefik
        kubernetes_sd_configs:
          - role: pod
            namespaces: { names: {{ .Values.metrics.ingress.traefik.namespaces | toJson }} }
            selectors:
              - role: pod
                label: {{ include "orchard.metricsIngressSelector" .Values.metrics.ingress.traefik.labels | quote }}
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace]
            regex: {{ join "|" .Values.metrics.ingress.traefik.namespaces | quote }}
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: {{ .Values.metrics.ingress.traefik.portName | quote }}
            action: keep
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: 'traefik_service_(requests_total|request_duration_seconds_(bucket|sum|count))'
            action: keep

---
apiVersion: v1
kind: Service
metadata:
  name: vmagent
  namespace: {{ $ns }}
  labels:
    app: vmagent
spec:
  type: ClusterIP
  ports:
    - { name: http, port: 8429, targetPort: 8429 }
  selector:
    app: vmagent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmagent
  namespace: {{ $ns }}
  labels:
    app: vmagent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vmagent
  template:
    metadata:
      labels:
        app: vmagent
    spec:
      serviceAccountName: vmagent
      {{- include "orchard.priorityClass" $ | nindent 6 }}
      containers:
        - name: vmagent
          image: {{ .Values.metrics.vmagent.image }}
          args:
            - "-promscrape.config=/config/scrape.yaml"
            - "-promscrape.maxScrapeSize=64MB"
            # Hot-reload the scrape config when the ConfigMap changes, so adding
            # a scrape job doesn't require a manual vmagent restart.
            - "-promscrape.configCheckInterval=30s"
            - "-remoteWrite.url=http://victoriametrics.{{ $ns }}.svc.cluster.local:8428/api/v1/write"
            - "-remoteWrite.tmpDataPath=/tmp/vmagent"
            - "-remoteWrite.maxDiskUsagePerURL=512MB"
            - "-memory.allowedPercent=80"
            - "-httpListenAddr=:8429"
            - "-loggerLevel=INFO"
          ports:
            - { name: http, containerPort: 8429 }
          volumeMounts:
            - { name: config, mountPath: /config }
            - { name: tmp,    mountPath: /tmp/vmagent }
            - { name: node-exporter-auth, mountPath: /etc/node-exporter-auth, readOnly: true }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml .Values.metrics.vmagent.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: config
          configMap: { name: vmagent-config }
        - name: tmp
          emptyDir: { sizeLimit: 1Gi }
        - name: node-exporter-auth
          secret:
            secretName: node-exporter-auth
            defaultMode: 0444
            items:
              - { key: password, path: password }
{{- end }}
